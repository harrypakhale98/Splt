name: Splt
options:
  bundleIdPrefix: com.harrypakhale
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "3"
    DEVELOPMENT_TEAM: DUHVN68KBA
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  SpltKit:
    path: Packages/SpltKit
targets:
  Splt:
    type: application
    platform: iOS
    sources:
      - path: Splt
        type: syncedFolder
    dependencies:
      - package: SpltKit
        product: SpltCore
    info:
      path: Config/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes:
          - venmo
          - upi
        CFBundleURLTypes:
          - CFBundleURLName: com.harrypakhale.splt
            CFBundleURLSchemes:
              - splt
        CKSharingSupported: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Splt Backup
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.harrypakhale.splt.backup
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.harrypakhale.splt.backup
            UTTypeDescription: Splt Backup
            UTTypeConformsTo:
              - public.data
              - public.content
            UTTypeTagSpecification:
              public.filename-extension:
                - spltbackup
        LSSupportsOpeningDocumentsInPlace: false
        UIBackgroundModes:
          - remote-notification
        UILaunchScreen:
          UIColorName: LaunchPaper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harrypakhale.splt
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Splt
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Dictate expenses by voice.
        INFOPLIST_KEY_NSCameraUsageDescription: Scan receipts and invite codes, and take group photos.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_ENTITLEMENTS: Splt/Sync/Splt.entitlements
  SpltTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SpltTests
        type: syncedFolder
    dependencies:
      - target: Splt
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.harrypakhale.splt.tests
        TARGETED_DEVICE_FAMILY: "1"
  SpltUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SpltUITests
        type: syncedFolder
    dependencies:
      - target: Splt
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.harrypakhale.splt.uitests
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Splt:
    build:
      targets:
        Splt: all
    test:
      targets:
        - SpltTests
        - SpltUITests
