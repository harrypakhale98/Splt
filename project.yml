name: Splt
options:
  bundleIdPrefix: com.harrypakhale
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  xcodeVersion: "27.2"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "7"
    DEVELOPMENT_TEAM: DUHVN68KBA
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    CLANG_CXX_LANGUAGE_STANDARD: gnu++20
packages:
  SpltKit:
    path: Packages/SpltKit
targets:
  Splt:
    type: application
    platform: iOS
    sources:
      - path: Splt
        type: syncedFolder
      - path: Shared
        type: syncedFolder
    dependencies:
      - package: SpltKit
        product: SpltCore
      - target: SpltWidgets
      - target: SpltShare
    info:
      path: Config/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes:
          - venmo
          - upi
        CFBundleURLTypes:
          - CFBundleURLName: com.harrypakhale.splt
            CFBundleURLSchemes:
              - splt
        CKSharingSupported: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Splt Backup
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.harrypakhale.splt.backup
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.harrypakhale.splt.backup
            UTTypeDescription: Splt Backup
            UTTypeConformsTo:
              - public.data
              - public.content
            UTTypeTagSpecification:
              public.filename-extension:
                - spltbackup
        LSSupportsOpeningDocumentsInPlace: false
        UIBackgroundModes:
          - remote-notification
        UILaunchScreen:
          UIColorName: LaunchPaper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harrypakhale.splt
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Splt
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Dictate expenses by voice.
        INFOPLIST_KEY_NSCameraUsageDescription: Scan receipts and invite codes, and take group photos.
        INFOPLIST_KEY_NSFaceIDUsageDescription: Splt uses Face ID to keep your groups and expenses private.
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_ENTITLEMENTS: Splt/Sync/Splt.entitlements
  SpltWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: SpltWidgets
        type: syncedFolder
      - path: Shared
        type: syncedFolder
    dependencies:
      - package: SpltKit
        product: SpltCore
    info:
      path: Config/SpltWidgets-Info.plist
      properties:
        CFBundleDisplayName: Splt
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harrypakhale.splt.widgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Config/SpltWidgets.entitlements
        SWIFT_EMIT_LOC_STRINGS: YES
        SKIP_INSTALL: YES
  SpltShare:
    type: app-extension
    platform: iOS
    sources:
      - path: SpltShare
        type: syncedFolder
      - path: Shared/Inbox
        type: syncedFolder
    dependencies:
      - package: SpltKit
        product: SpltCore
    info:
      path: Config/SpltShare-Info.plist
      properties:
        CFBundleDisplayName: Splt
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harrypakhale.splt.share
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Config/SpltShare.entitlements
        SWIFT_EMIT_LOC_STRINGS: YES
        SKIP_INSTALL: YES
  SpltTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SpltTests
        type: syncedFolder
    dependencies:
      - target: Splt
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.harrypakhale.splt.tests
        TARGETED_DEVICE_FAMILY: "1"
  SpltUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SpltUITests
        type: syncedFolder
    dependencies:
      - target: Splt
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.harrypakhale.splt.uitests
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Splt:
    build:
      targets:
        Splt: all
    test:
      targets:
        - SpltTests
        - SpltUITests
