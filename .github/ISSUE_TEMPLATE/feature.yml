name: Feature request
description: Suggest something Splt could do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: Describe the situation first. The idea can come after.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
  - type: markdown
    attributes:
      value: Splt stays free, with no ads and no tracking. Ideas that need a server or a paid service will not fit.
